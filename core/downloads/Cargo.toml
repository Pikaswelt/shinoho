[package]
name = "shinoho-downloads"
version = "0.1.0"
description = "Shinoho Browser Download Manager Backend"
edition = "2024"
rust-version = "1.90"

[lib]
doctest = false

[dependencies]
shinoho-storage = { path = "../storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4"] }
dirs = "7.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "fs", "io-util", "time", "macros"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
log = "0.4"
url = "2.5"

[dev-dependencies]
tempfile = "3.27"
