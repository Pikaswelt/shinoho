[package]
name = "shinoho-storage"
version = "0.1.0"
edition = "2021"
description = "SQLite storage backend for Shinoho (History, Bookmarks, Settings, Downloads)"
license = "MPL-2.0"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"
