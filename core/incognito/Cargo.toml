[package]
name = "shinoho-incognito"
version = "0.1.0"
edition = "2021"
description = "Ephemeral incognito profile and session backend for Shinoho"
license = "MPL-2.0"

[dependencies]
shinoho-storage = { path = "../storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4"] }
tempfile = "3.10"
chrono = { version = "0.4", features = ["serde"] }
