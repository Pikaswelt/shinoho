[package]
name = "shinoho-vpn"
description = "Shinoho VPN: WireGuard-Tunnel, SOCKS5-Proxy, Konfigurationen und Anbieterliste"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/Pikaswelt/shinoho"
rust-version = "1.77"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-dns"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util"] }
tauri = { version = "2", optional = true }

[features]
# Tauri-Befehle für VPN und die Proxy-Weiche der WebViews (T-403).
tauri = ["dep:tauri"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
