[package]
name = "shinoho-adblock"
version = "0.1.0"
edition = "2021"
description = "Ad and tracker blocker powered by adblock-rust for Shinoho"
license = "MPL-2.0"

[lib]
doctest = false

[dependencies]
# `single-thread` (adblock default) macht die Engine !Sync und bricht Tauri-State.
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
url = "2.5"
