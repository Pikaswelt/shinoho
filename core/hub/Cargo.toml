[package]
name = "shinoho-hub"
version = "0.1.0"
edition = "2021"
description = "Persistenter Zustand der Startseite (Hub): Hintergrund, Speed Dial, Suchmaschine und Widgets"
license = "MPL-2.0"

[dependencies]
shinoho-storage = { path = "../storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
