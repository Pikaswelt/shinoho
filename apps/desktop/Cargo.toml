[package]
name = "shinoho-desktop"
version = "0.1.0"
description = "Shinoho Browser Desktop Application"
edition = "2024"
rust-version = "1.90"

[lib]
name = "shinoho_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
shinoho-core = { path = "../../core" }
shinoho-storage = { path = "../../core/storage" }
shinoho-incognito = { path = "../../core/incognito" }
shinoho-adblock = { path = "../../core/adblock" }
shinoho-downloads = { path = "../../core/downloads" }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3.10"
